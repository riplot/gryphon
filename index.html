<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>GryphonTube</title>

  <link
    rel="stylesheet"
    href="css.css"
  >

</head>


<body>

  <!-- ==================== TOP BAR ==================== -->

  <header class="topbar">

    <button
      class="mobile-menu"
      onclick="toggleSidebar()"
    >
      ☰
    </button>


    <div
      class="logo"
      onclick="showAll()"
    >

      <span class="logo-icon">
        ▶
      </span>

      GryphonTube

    </div>


    <div class="search">

    <input
  id="searchInput"
  type="search"
  placeholder="Search GryphonTube"
  autocomplete="new-password"
  readonly
  onfocus="this.removeAttribute('readonly')"
  onkeydown="if(event.key==='Enter') searchVideos()"
>

      <button onclick="searchVideos()">
        🔍
      </button>

    </div>


    <div class="top-buttons">

      <button
        onclick="document.getElementById('videoUpload').click()"
        title="Upload video"
      >
        ⬆️
      </button>


      <button
        onclick="omega()"
        title="Dark mode"
      >
        🌙
      </button>


      <button
        onclick="showNotifications()"
        title="Notifications"
      >
        🔔
      </button>


      <button
        class="profile"
        id="profileButton"
        onclick="openAccount()"
        title="Account"
      >
        G
      </button>

    </div>

  </header>


  <!-- ==================== UPLOAD ==================== -->

  <input
    type="file"
    id="videoUpload"
    accept="video/mp4,video/webm,video/ogg"
    style="display:none"
    onchange="uploadVideo(event)"
  >


  <!-- ==================== SIDEBAR ==================== -->

  <aside
    class="sidebar"
    id="sidebar"
  >

    <button
      class="side-button active"
      onclick="showAll()"
    >
      🏠
      <span>Home</span>
    </button>


    <button
      class="side-button"
      onclick="showRecent()"
    >
      🕒
      <span>Recent</span>
    </button>


    <button
      class="side-button"
      onclick="openOwnChannel()"
    >
      👤
      <span>Your Channel</span>
    </button>


    <div class="sidebar-divider"></div>


    <h3>
      Categories
    </h3>


    <button
      class="side-button"
      onclick="filterCategory('Gaming')"
    >
      🎮
      <span>Gaming</span>
    </button>


    <button
      class="side-button"
      onclick="filterCategory('Music')"
    >
      🎵
      <span>Music</span>
    </button>


    <button
      class="side-button"
      onclick="filterCategory('Animation')"
    >
      🎨
      <span>Animation</span>
    </button>


    <button
      class="side-button"
      onclick="filterCategory('Funny')"
    >
      😂
      <span>Funny</span>
    </button>

  </aside>


  <!-- ==================== MAIN ==================== -->

  <main class="content">

    <div class="category-bar">

      <button
        class="active"
        onclick="showAll()"
      >
        All
      </button>


      <button
        onclick="filterCategory('Gaming')"
      >
        Gaming
      </button>


      <button
        onclick="filterCategory('Music')"
      >
        Music
      </button>


      <button
        onclick="filterCategory('Animation')"
      >
        Animation
      </button>


      <button
        onclick="filterCategory('Funny')"
      >
        Funny
      </button>

    </div>


    <!-- ==================== FEATURED ==================== -->

    <section>

      <div class="section-header">

        <h1>
          Featured
        </h1>

      </div>

      <div id="featuredVideo"></div>

    </section>


    <!-- ==================== RECENT ==================== -->

    <section>

      <div class="section-header">

        <h1>
          Recently uploaded
        </h1>


        <button
          class="text-button"
          onclick="showRecent()"
        >
          See all
        </button>

      </div>


      <div
        id="recentGrid"
        class="video-grid"
      ></div>

    </section>


    <!-- ==================== ALL VIDEOS ==================== -->

    <section>

      <div class="section-header">

        <h1 id="videoSectionTitle">
          All videos
        </h1>

      </div>


      <div
        id="videoGrid"
        class="video-grid"
      ></div>

    </section>

  </main>


  <!-- ==================== VIDEO PLAYER ==================== -->

  <div
    id="player"
    class="overlay hidden"
  >

    <div class="player-window">

      <button
        class="close-player"
        onclick="closePlayer()"
      >
        ✕
      </button>


      <video
        id="mainVideo"
        controls
        playsinline
      ></video>


      <div class="player-details">

        <h1 id="playerTitle"></h1>


        <button
          class="creator-link"
          id="playerCreator"
          onclick="openSelectedCreatorChannel()"
        ></button>


        <p id="playerInfo"></p>


        <div class="player-actions">

          <button
            id="likeButton"
            onclick="toggleLike()"
          >
            ❤️ Like
          </button>


          <button onclick="copyVideoLink()">
            🔗 Share
          </button>

        </div>


        <!-- COMMENTS -->

        <div class="comments">

          <h2>
            Comments
          </h2>


          <div class="comment-box">

            <input
              id="commentInput"
              type="text"
              maxlength="500"
              placeholder="Add a comment..."
              onkeydown="if(event.key==='Enter') addComment()"
            >


            <button onclick="addComment()">
              Comment
            </button>

          </div>


          <div id="commentList"></div>

        </div>

      </div>

    </div>

  </div>


  <!-- ==================== ACCOUNT ==================== -->

  <div
    id="accountModal"
    class="overlay hidden"
  >

    <div class="modal-window auth-window">

      <button
        class="close-player"
        onclick="closeAccount()"
      >
        ✕
      </button>


      <!-- LOGGED OUT -->

      <div id="loggedOutAccount">

        <div
          class="profile-edit-icon"
          id="authIcon"
        >
          G
        </div>


        <h1 id="authTitle">
          Sign in to GryphonTube
        </h1>


        <p
          id="authStatus"
          class="auth-status"
        ></p>


        <label>
          Email
        </label>


        <input
          id="authEmail"
          type="email"
          placeholder="you@example.com"
          autocomplete="email"
        >


        <label>
          Password
        </label>


        <input
          id="authPassword"
          type="password"
          placeholder="Password"
          autocomplete="current-password"
        >


        <div
          id="signupFields"
          class="hidden"
        >

          <label>
            Channel name
          </label>


          <input
            id="authChannelName"
            type="text"
            maxlength="40"
            placeholder="Your channel name"
          >


          <label>
            Channel bio
          </label>


          <textarea
            id="authBio"
            maxlength="160"
            placeholder="Tell people about your channel..."
          ></textarea>

        </div>


        <button
          id="authSubmitButton"
          class="primary-button"
          onclick="submitAuth()"
        >
          Sign In
        </button>


        <button
          id="authSwitchButton"
          class="secondary-button"
          onclick="switchAuthMode()"
        >
          Create an account
        </button>

      </div>


      <!-- LOGGED IN -->

      <div
        id="loggedInAccount"
        class="hidden"
      >

        <div
          class="profile-edit-icon"
          id="accountIcon"
        >
          G
        </div>


        <h1>
          Your Account
        </h1>


        <p
          id="accountEmail"
          class="account-email"
        ></p>


        <label>
          Channel name
        </label>


        <input
          id="accountChannelName"
          type="text"
          maxlength="40"
        >


        <label>
          Channel bio
        </label>


        <textarea
          id="accountBio"
          maxlength="160"
        ></textarea>


        <label>
          Profile color
        </label>


        <div class="profile-colors">

          <button
            class="color-choice purple"
            onclick="chooseProfileColor('#673ab7')"
          ></button>

          <button
            class="color-choice blue"
            onclick="chooseProfileColor('#1976d2')"
          ></button>

          <button
            class="color-choice green"
            onclick="chooseProfileColor('#2e7d32')"
          ></button>

          <button
            class="color-choice orange"
            onclick="chooseProfileColor('#ef6c00')"
          ></button>

          <button
            class="color-choice red"
            onclick="chooseProfileColor('#d32f2f')"
          ></button>

        </div>


        <button
          class="primary-button"
          onclick="saveAccountProfile()"
        >
          Save Profile
        </button>


        <button
          class="secondary-button"
          onclick="signOut()"
        >
          Sign Out
        </button>

      </div>

    </div>

  </div>


  <!-- ==================== CHANNEL ==================== -->

  <div
    id="channelModal"
    class="overlay hidden"
  >

    <div class="channel-window">

      <button
        class="close-player"
        onclick="closeChannel()"
      >
        ✕
      </button>


      <div class="channel-header">

        <div
          class="big-channel-icon"
          id="channelIcon"
        >
          G
        </div>


        <div class="channel-info">

          <h1 id="channelName"></h1>

          <p id="channelStats"></p>

          <p
            class="channel-bio"
            id="channelBio"
          ></p>

        </div>

      </div>


      <div
        id="channelGrid"
        class="video-grid"
      ></div>

    </div>

  </div>


  <!-- ==================== NOTIFICATIONS ==================== -->

  <div
    id="notificationBox"
    class="notification-box hidden"
  >
    🔔 No new notifications
  </div>


  <!-- ==================== SUPABASE ==================== -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="script.js?v=6"></script>
  <script src="script.js?v=999"></script>

</body>

</html>
