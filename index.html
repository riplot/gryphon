```html
<!DOCTYPE html>
<html>
<head>
  <title>GryphonTube</title>
  <link rel="stylesheet" href="css.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

<header class="topbar">

  <div class="logo">
    <span class="logo-icon">▶</span>
    GryphonTube
  </div>

  <div class="search">
    <input id="searchInput" type="text" placeholder="Search">
    <button onclick="searchVideos()">🔍</button>
  </div>

  <div class="top-buttons">

    <!-- UPLOAD BUTTON -->
    <button onclick="document.getElementById('videoUpload').click()"title="Upload video">⬆️</button>

    <button onclick="omega()" title="Dark mode">🌙</button>
    <button>🔔</button>
    <button class="profile">G</button>

  </div>

</header>


<!-- HIDDEN FILE UPLOAD -->

<input type="file" accept="video/*" onchange="uploadVideo(event)">


<aside class="sidebar">

  <button class="side-btn" onclick="showAll()">
    🏠 <span>Home</span>
  </button>

  <button class="side-btn" onclick="showAll()">
    🔥 <span>Trending</span>
  </button>

  <button class="side-btn">
    📺 <span>Subscriptions</span>
  </button>

  <hr>

  <button class="side-btn">
    📚 <span>Library</span>
  </button>

  <button class="side-btn">
    🕘 <span>History</span>
  </button>

  <button class="side-btn">
    👍 <span>Liked videos</span>
  </button>

  <hr>

  <h3>You</h3>

  <button class="side-btn">
    🎵 <span>Music</span>
  </button>

  <button class="side-btn">
    🎮 <span>Gaming</span>
  </button>

</aside>


<main class="content">

  <div class="category-bar">

    <button class="active" onclick="showAll()">All</button>
    <button onclick="filterCategory('Gaming')">Gaming</button>
    <button onclick="filterCategory('Music')">Music</button>
    <button onclick="filterCategory('Animation')">Animation</button>
    <button onclick="filterCategory('Funny')">Funny</button>

  </div>


  <section id="videoGrid" class="video-grid"></section>

</main>


<!-- VIDEO PLAYER -->

<div id="player" class="player hidden">

  <div class="player-window">

    <button class="close-player" onclick="closePlayer()">
      ✕
    </button>

    <video id="mainVideo" controls></video>

    <h1 id="playerTitle"></h1>

    <p id="playerCreator"></p>

    <p id="playerInfo"></p>

  </div>

</div>


<script>

/* ==========================================
   STARTING VIDEOS
   ========================================== */

const videos = [

  {
    title: "Welcome to GryphonTube!",
    creator: "GryphonTube",
    video: "video1.mp4",
    thumbnail: "gusty.jpeg",
    views: "1.2K views",
    date: "2 days ago",
    category: "Funny"
  }

];


/* ==========================================
   SHOW VIDEOS
   ========================================== */

function displayVideos(list) {

  const grid = document.getElementById("videoGrid");

  grid.innerHTML = "";

  if (list.length === 0) {

    grid.innerHTML =
      "<h2>No videos found.</h2>";

    return;

  }


  list.forEach((video, index) => {

    const card =
      document.createElement("article");

    card.className = "video-card";


    card.innerHTML = `

      <div class="thumbnail">

        <img src="${video.thumbnail}">

      </div>

      <div class="video-info">

        <div class="channel-icon">
          ${video.creator.charAt(0).toUpperCase()}
        </div>

        <div>

          <h2>${video.title}</h2>

          <p>${video.creator}</p>

          <p>${video.views} • ${video.date}</p>

        </div>

      </div>

    `;


    card.onclick = function() {

      openVideo(video);

    };


    grid.appendChild(card);

  });

}


/* ==========================================
   UPLOAD YOUR OWN VIDEO
   ========================================== */

function uploadVideo(event) {

  const file =
    event.target.files[0];

  if (!file) {
    return;
  }


  /* Make sure it is a video */

  if (!file.type.startsWith("video/")) {

    alert("Please choose a video file.");

    return;

  }


  /* Create a temporary URL for the video */

  const videoURL =
    URL.createObjectURL(file);


  /* Use a generic thumbnail */

  const newVideo = {

    title: file.name
      .replace(/\.[^/.]+$/, ""),

    creator: "You",

    video: videoURL,

    thumbnail: "gusty.jpeg",

    views: "0 views",

    date: "Just now",

    category: "Funny"

  };


  /* Add it to GryphonTube */

  videos.unshift(newVideo);


  /* Refresh the homepage */

  displayVideos(videos);


  /* Automatically open your video */

  openVideo(newVideo);


  /* Reset file input so another upload works */

  event.target.value = "";

}


/* ==========================================
   OPEN VIDEO
   ========================================== */

function openVideo(video) {

  const player =
    document.getElementById("player");

  const mainVideo =
    document.getElementById("mainVideo");


  mainVideo.src = video.video;


  document.getElementById("playerTitle")
    .textContent = video.title;


  document.getElementById("playerCreator")
    .textContent = video.creator;


  document.getElementById("playerInfo")
    .textContent =
      video.views + " • " + video.date;


  player.classList.remove("hidden");


  mainVideo.play();

}


/* ==========================================
   CLOSE PLAYER
   ========================================== */

function closePlayer() {

  const mainVideo =
    document.getElementById("mainVideo");


  mainVideo.pause();

  mainVideo.removeAttribute("src");

  mainVideo.load();


  document.getElementById("player")
    .classList.add("hidden");

}


/* ==========================================
   SEARCH
   ========================================== */

function searchVideos() {

  const search =
    document.getElementById("searchInput")
      .value
      .toLowerCase();


  const results =
    videos.filter(video =>

      video.title
        .toLowerCase()
        .includes(search)

      ||

      video.creator
        .toLowerCase()
        .includes(search)

    );


  displayVideos(results);

}


/* ==========================================
   CATEGORY
   ========================================== */

function filterCategory(category) {

  const results =
    videos.filter(video =>
      video.category === category
    );


  displayVideos(results);

}


/* ==========================================
   HOME
   ========================================== */

function showAll() {

  displayVideos(videos);

}


/* ==========================================
   DARK MODE
   ========================================== */

function omega() {

  document.body
    .classList
    .toggle("dark-mode");

}


/* ==========================================
   START
   ========================================== */

displayVideos(videos);

</script>

</body>
</html>
```
