<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>GryphonTube</title>

  <link rel="stylesheet" href="css.css">
</head>

<body>

  <!-- ==================== TOP BAR ==================== -->
  <header class="topbar">

    <button class="mobile-menu" onclick="toggleSidebar()">☰</button>

    <div class="logo" onclick="showAll()">
      <span class="logo-icon">▶</span>
      GryphonTube
    </div>

    <div class="search">
      <input
        id="searchInput"
        type="text"
        placeholder="Search"
        onkeydown="if(event.key==='Enter') searchVideos()"
      >

      <button onclick="searchVideos()">🔍</button>
    </div>

    <div class="top-buttons">

      <button
        onclick="document.getElementById('videoUpload').click()"
        title="Upload video"
      >
        ⬆️
      </button>

      <button onclick="omega()" title="Dark mode">
        🌙
      </button>

      <button onclick="showNotifications()" title="Notifications">
        🔔
      </button>

      <button
        class="profile"
        id="profileButton"
        onclick="openProfile()"
        title="Profile"
      >
        G
      </button>

    </div>

  </header>


  <!-- ==================== UPLOAD ==================== -->

  <input
    type="file"
    id="videoUpload"
    accept="video/mp4,video/webm,video/ogg"
    style="display:none"
    onchange="uploadVideo(event)"
  >


  <!-- ==================== SIDEBAR ==================== -->

  <aside class="sidebar" id="sidebar">

    <button class="side-button active" onclick="showAll()">
      🏠
      <span>Home</span>
    </button>

    <button class="side-button" onclick="showRecent()">
      🕒
      <span>Recent</span>
    </button>

    <button class="side-button" onclick="showLiked()">
      ❤️
      <span>Liked</span>
    </button>

    <button class="side-button" onclick="openProfile()">
      👤
      <span>Your Channel</span>
    </button>

    <div class="sidebar-divider"></div>

    <h3>Categories</h3>

    <button class="side-button" onclick="filterCategory('Gaming')">
      🎮
      <span>Gaming</span>
    </button>

    <button class="side-button" onclick="filterCategory('Music')">
      🎵
      <span>Music</span>
    </button>

    <button class="side-button" onclick="filterCategory('Animation')">
      🎨
      <span>Animation</span>
    </button>

    <button class="side-button" onclick="filterCategory('Funny')">
      😂
      <span>Funny</span>
    </button>

  </aside>


  <!-- ==================== MAIN ==================== -->

  <main class="content">

    <!-- CATEGORY BAR -->
    <div class="category-bar">

      <button class="active" onclick="showAll()">
        All
      </button>

      <button onclick="filterCategory('Gaming')">
        Gaming
      </button>

      <button onclick="filterCategory('Music')">
        Music
      </button>

      <button onclick="filterCategory('Animation')">
        Animation
      </button>

      <button onclick="filterCategory('Funny')">
        Funny
      </button>

    </div>


    <!-- ==================== FEATURED ==================== -->

    <section id="featuredSection" class="featured-section">

      <div class="section-header">
        <h1>Featured</h1>
      </div>

      <div id="featuredVideo"></div>

    </section>


    <!-- ==================== RECENT ==================== -->

    <section>

      <div class="section-header">
        <h1>Recently uploaded</h1>

        <button
          class="text-button"
          onclick="showRecent()"
        >
          See all
        </button>
      </div>

      <div
        id="recentGrid"
        class="video-grid"
      ></div>

    </section>


    <!-- ==================== ALL VIDEOS ==================== -->

    <section>

      <div class="section-header">

        <h1 id="videoSectionTitle">
          All videos
        </h1>

      </div>

      <div
        id="videoGrid"
        class="video-grid"
      ></div>

    </section>

  </main>


  <!-- ==================== VIDEO PLAYER ==================== -->

  <div
    id="player"
    class="overlay hidden"
  >

    <div class="player-window">

      <button
        class="close-player"
        onclick="closePlayer()"
      >
        ✕
      </button>


      <video
        id="mainVideo"
        controls
        playsinline
      ></video>


      <div class="player-details">

        <h1 id="playerTitle"></h1>

        <button
          class="creator-link"
          id="playerCreator"
          onclick="openSelectedCreatorChannel()"
        ></button>

        <p id="playerInfo"></p>


        <div class="player-actions">

          <button
            id="likeButton"
            onclick="toggleLike()"
          >
            ❤️ Like
          </button>

          <button onclick="copyVideoLink()">
            🔗 Share
          </button>

        </div>


        <!-- COMMENTS -->

        <div class="comments">

          <h2>
            Comments
          </h2>

          <div class="comment-box">

            <input
              id="commentInput"
              type="text"
              maxlength="500"
              placeholder="Add a comment..."
              onkeydown="if(event.key==='Enter') addComment()"
            >

            <button onclick="addComment()">
              Comment
            </button>

          </div>

          <div id="commentList"></div>

        </div>

      </div>

    </div>

  </div>


  <!-- ==================== PROFILE MODAL ==================== -->

  <div
    id="profileModal"
    class="overlay hidden"
  >

    <div class="modal-window">

      <button
        class="close-player"
        onclick="closeProfile()"
      >
        ✕
      </button>

      <h1>Your Channel</h1>

      <label>
        Channel name
      </label>

      <input
        id="profileNameInput"
        type="text"
        maxlength="40"
        placeholder="Your channel name"
      >

      <button
        class="primary-button"
        onclick="saveProfile()"
      >
        Save Channel
      </button>

      <button
        class="secondary-button"
        onclick="openOwnChannel()"
      >
        View Channel
      </button>

    </div>

  </div>


  <!-- ==================== CHANNEL MODAL ==================== -->

  <div
    id="channelModal"
    class="overlay hidden"
  >

    <div class="channel-window">

      <button
        class="close-player"
        onclick="closeChannel()"
      >
        ✕
      </button>

      <div class="channel-header">

        <div
          class="big-channel-icon"
          id="channelIcon"
        >
          G
        </div>

        <div>
          <h1 id="channelName"></h1>
          <p id="channelStats"></p>
        </div>

      </div>

      <div
        id="channelGrid"
        class="video-grid"
      ></div>

    </div>

  </div>


  <!-- ==================== NOTIFICATIONS ==================== -->

  <div
    id="notificationBox"
    class="notification-box hidden"
  >
    🔔 No new notifications
  </div>


  <!-- ==================== SUPABASE ==================== -->

 <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="script.js?v=3"></script>

</body>
</html>
